# config/packages/security.yaml

security:
  providers:
    authors:
      entity:
        class: App\Entity\Author
        property: username
  firewalls:
    main:
      lazy: true
      provider: authors
      custom_authenticators:
        - App\Security\MobileIdAuthenticator
      entry_point: App\Security\MobileIdAuthenticator

      logout:
        path: logout
        target: login
  access_control:
    - { path: '^/blog', roles: ROLE_ADMIN }
